<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Ledger</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone column. A kitchen-scale readout on top (big number over a ruled gauge),
   ledger rows underneath, three tabs pinned at the bottom. */
:root{
  --paper:#0b0d12; --card:#151923; --field:#1f2532; --ink:#f3f5f9; --muted:#8a93a6; --line:#262d3b;
  --accent:#ff7a3d; --on-accent:#1a0e06;
  --pro:#ff5d73; --carb:#ffc24b; --fat:#4cc9f0; --warn:#ff4d4d;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
.num{font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;font-weight:700;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.datenav{display:flex;align-items:center;gap:4px}
.icon{width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;
  display:grid;place-items:center;font-size:18px;line-height:1}
.icon:disabled{opacity:.35;cursor:default}

/* readout */
.readout{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.03em}
.bigrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bigrow .unit{font-size:14px;color:var(--muted);padding-bottom:6px}
.over .big{color:var(--warn)}
.gauge{position:relative;height:30px;border-radius:4px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.gauge .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.9;transition:width .35s ease}
.over .gauge .fill{background:var(--warn)}
.gauge .ticks{position:absolute;inset:0;
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 5%),
                   repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 25%);
  background-size:100% 35%,100% 70%;background-repeat:no-repeat;background-position:left bottom,left bottom;opacity:.28}
.gaugelab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{display:flex;flex-direction:column;gap:5px;min-width:0}
.macro .lab{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.macro .dot{width:8px;height:8px;border-radius:2px;background:var(--c)}
.macro .val{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.macro .val span{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .35s ease}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--carb);padding:2px 0 2px 10px}

/* ledger */
.sect{display:flex;flex-direction:column;gap:8px}
.secthead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.rows>.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:500;overflow-wrap:anywhere}
.row .sub{font-size:12px;color:var(--muted)}
.row .kc{font-family:var(--display);font-weight:700;font-size:17px;white-space:nowrap}
.row .x{width:32px;height:32px;border:0;background:none;color:var(--muted);font-size:18px;border-radius:8px;flex:none}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.pcf b{font-weight:600}
.pcf .p{color:var(--pro)} .pcf .c{color:var(--carb)} .pcf .f{color:var(--fat)}

.btn{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:12px;padding:13px 16px;min-height:48px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],select{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kv .v{font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
a{color:var(--accent)}
textarea{width:100%;min-height:76px;padding:10px 12px;border:0;background:var(--field);border-radius:14px;font:inherit;font-size:16px;color:inherit;resize:none;display:block}
.shot{width:100%;max-height:170px;object-fit:cover;border-radius:16px;display:block}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
.tag.ok{color:var(--accent);border-color:var(--accent)}
.pill.ok{color:var(--accent);border-color:var(--accent)}
.pill.bad{color:var(--warn);border-color:var(--warn)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* tabs */
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card)}
nav button{border:0;background:none;padding:12px 4px 14px;font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current=page]{color:var(--ink);border-top-color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.open{display:flex}
.sheet{width:100%;max-width:480px;max-height:88%;background:var(--paper);border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0;
  display:flex;flex-direction:column;gap:12px;padding:16px;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.gauge .fill,.bar i{transition:none}}
.sheet .list{overflow-y:auto;flex:1;min-height:120px}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px}
.stepper .q{font-family:var(--display);font-weight:800;font-size:40px;min-width:90px;text-align:center}
svg{max-width:100%;display:block}

/* skin: soft dark cards, calorie ring, pill buttons */
.readout,.card,.rows{border:0;border-radius:22px}
.readout{padding:20px;gap:18px}
.row{border-top-color:var(--line);padding:13px 16px}
.btn{border-radius:99px;min-height:54px}
.btn.ghost{border-color:var(--line)}
.btn.cam{display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 12px 28px -10px var(--accent)}
.icon{border:0;border-radius:99px;background:var(--card)}
.sheet .icon{background:var(--field)}
.ring{position:relative;width:204px;height:204px;margin:0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .prog{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.over .ring .prog{stroke:var(--warn)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.ring .big{font-size:54px}
.ring .unit{font-size:13px;color:var(--muted)}
.macro{background:var(--paper);border-radius:16px;padding:12px}
.bar{border:0;background:var(--line)}
.gaugelab{font-size:13px}
input[type=text],input[type=number],input[type=search],input[type=date],select{border:0;background:var(--field);border-radius:14px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
.sheet{border:0;border-radius:26px 26px 0 0}
.note{border-left-color:var(--accent)}
nav{border-top:0;border-radius:22px 22px 0 0}
nav button{border-top:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:12px 4px 14px}
nav button[aria-current=page]{color:var(--accent)}
nav svg,.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.ring .prog{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main id="main"></main>
  <nav aria-label="Sections">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>Today</button>
    <button type="button" data-tab="weight"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 3 7-8"/></svg>Weight</button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>Plan</button>
  </nav>
</div>
<input type="file" id="photo" accept="image/*" hidden>
<input type="file" id="restore" accept="application/json,.json" hidden>
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add food"></div></div>

<script>
/* ---------- food list: approximate values per serving [name, serving, kcal, protein, carbs, fat] ---------- */
const FOODS=[
["Roti / chapati","1 medium",120,3.5,20,3],["Cooked white rice","1 cup",205,4,45,0.4],["Dal tadka","1 katori",150,8,18,5],
["Paneer","100 g",290,18,4,22],["Curd (dahi)","1 katori",95,5,7,5],["Greek yogurt","100 g",60,10,3.5,0.4],
["Whole egg","1 large",72,6,0.4,5],["Egg white","1",17,3.6,0.2,0],["Chicken breast, cooked","100 g",165,31,0,3.6],
["Chicken curry","1 katori",280,24,8,17],["Butter chicken","1 katori",380,24,10,27],["Fish curry","1 katori",220,20,6,13],
["Chicken biryani","1 plate",520,26,60,18],["Veg pulao","1 cup",260,5,42,8],["Rajma","1 katori",170,9,24,4],
["Chole","1 katori",210,9,27,7],["Palak paneer","1 katori",240,11,9,18],["Mixed veg sabzi","1 katori",120,3,12,7],
["Sambar","1 katori",110,5,16,3],["Idli","1 piece",60,2,12,0.3],["Plain dosa","1",170,4,28,5],["Masala dosa","1",350,7,50,13],
["Poha","1 plate",270,5,45,8],["Upma","1 plate",250,6,40,8],["Plain paratha","1",260,5,36,10],["Aloo paratha","1",330,7,45,13],
["Naan","1",260,8,45,5],["White bread","1 slice",75,2.5,14,1],["Oats, dry","40 g",150,5,27,3],["Instant noodles","1 pack",310,7,44,12],
["Toned milk","250 ml",150,8,12,8],["Whey protein","1 scoop",120,24,3,1.5],["Soya chunks, dry","50 g",173,26,16.5,0.3],
["Tofu, firm","100 g",145,15,3.5,8.5],["Moong sprouts","1 cup",105,7,19,0.5],["Peanut butter","1 tbsp",95,4,3,8],
["Almonds","10 pieces",70,2.6,2.5,6],["Roasted peanuts","30 g",170,7.5,5,14],["Banana","1 medium",105,1.3,27,0.4],
["Apple","1 medium",95,0.5,25,0.3],["Orange","1 medium",62,1.2,15,0.2],["Boiled potato","100 g",87,1.9,20,0.1],
["Sweet potato, boiled","100 g",86,1.6,20,0.1],["Ghee","1 tsp",45,0,0,5],["Cooking oil","1 tsp",40,0,0,4.5],
["Chai with milk and sugar","1 cup",90,2,14,2.5],["Filter coffee with milk and sugar","1 cup",80,2,12,2.5],["Samosa","1",260,4,30,14]
].map(a=>({n:a[0],u:a[1],k:a[2],p:a[3],c:a[4],f:a[5]}));

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const ymOf=s=>s.slice(0,7), ddOf=s=>s.slice(8);
const nice=s=>{const t=today();if(s===t)return'Today';if(s===addDays(t,-1))return'Yesterday';
  return parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};

/* ---------- state ---------- */
const LS='macroledger.v1';
const blankMeta=()=>({updated:0,profile:null,targets:null,weights:{},custom:[],recent:[]});
let S={meta:blankMeta(),logs:{}};
let view={tab:'today',date:today()};
let sync='device';              // 'device' | 'account' | 'error'
let store=null; const loaded=new Set(), dirty=new Set(); let timer=null, chain=Promise.resolve();
const DEF={sex:'m',age:25,height:172,weight:70,activity:1.375,pace:0,ppk:1.8};

try{const raw=localStorage.getItem(LS);if(raw){const j=JSON.parse(raw);if(j&&j.meta){S.meta=Object.assign(blankMeta(),j.meta);S.logs=j.logs||{}}}}catch(e){}
const cache=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};

function month(k){if(!S.logs[k])S.logs[k]={updated:0,days:{}};return S.logs[k]}
function items(date){const m=S.logs[ymOf(date)];return(m&&m.days[ddOf(date)])||[]}
function totals(date){const t={k:0,p:0,c:0,f:0};for(const i of items(date)){t.k+=i.k;t.p+=i.p;t.c+=i.c;t.f+=i.f}return t}

function touch(key){
  const now=Date.now();
  if(key==='meta')S.meta.updated=now;else month(key).updated=now;
  dirty.add(key);cache();clearTimeout(timer);timer=setTimeout(flush,700);
}
const ref=k=>store.db.doc(store.base+(k==='meta'?'meta':'log-'+k));
function flush(){
  if(!store||!dirty.size)return;
  const keys=[...dirty];dirty.clear();
  chain=chain.then(async()=>{
    for(const k of keys){
      try{await ref(k).set(JSON.parse(JSON.stringify(k==='meta'?S.meta:S.logs[k])));if(sync==='error'){sync='account';render()}}
      catch(e){dirty.add(k);if(sync!=='error'){sync='error';render()}}
    }
  });
}
async function pull(k){
  const snap=await ref(k).get();
  const local=k==='meta'?S.meta:S.logs[k];
  const remote=snap.exists?snap.data():null;
  if(remote&&(remote.updated||0)>=((local&&local.updated)||0)){
    const copy=JSON.parse(JSON.stringify(remote));
    if(k==='meta')S.meta=Object.assign(blankMeta(),copy);else S.logs[k]=Object.assign({updated:0,days:{}},copy);
  }else if(local&&local.updated){dirty.add(k)}
  loaded.add(k);
}
async function ensureMonth(k){
  month(k);
  if(store&&!loaded.has(k)){try{await pull(k);cache();render()}catch(e){}}
}
async function connect(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    store={db,base:'data/users/'+uid+'/'};
    const t=today();
    await pull('meta');await pull(ymOf(t));
    const prev=ymOf(addDays(t,-21));if(prev!==ymOf(t))await pull(prev);
    sync='account';cache();flush();render();
  }catch(e){store=null}
}

/* ---------- maths ---------- */
const r0=n=>Math.round(n), r1=n=>Math.round(n*10)/10;
function calc(p,tdeeOverride){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const formula=bmr*p.activity;
  const tdee=tdeeOverride||formula;
  const daily=p.weight*(p.pace/100)*7700/7;           // kcal per day needed for the chosen weekly pace
  const floor=p.sex==='m'?1500:1200;
  let kcal=tdee+daily, floored=false;
  if(kcal<floor){kcal=floor;floored=true}
  const pro=p.ppk*p.weight;
  const fat=Math.max(0.6*p.weight,kcal*0.25/9);
  const carb=Math.max(0,(kcal-pro*4-fat*9)/4);
  return{bmr:r0(bmr),formula:r0(formula),tdee:r0(tdee),kcal:r0(kcal),p:r0(pro),c:r0(carb),f:r0(fat),floored};
}
function targets(){return S.meta.targets||Object.assign({example:true},calc(DEF))}
function trend(){
  const ds=Object.keys(S.meta.weights).sort();const out=[];let t=null,prev=null;
  for(const d of ds){const w=S.meta.weights[d];
    if(t===null)t=w;else{const a=1-Math.pow(0.9,Math.max(1,diffDays(prev,d)));t+=a*(w-t)}
    out.push({d,w,t});prev=d}
  return out;
}
function adaptive(){
  const end=addDays(today(),-1),start=addDays(today(),-21);
  let sum=0,n=0;
  for(let d=start;d<=end;d=addDays(d,1)){const k=totals(d).k;if(k>0){sum+=k;n++}}
  const win=trend().filter(x=>x.d>=start);
  const span=win.length>1?diffDays(win[0].d,win[win.length-1].d):0;
  if(n<7||span<7)return{ready:false,n,span,wn:win.length};
  const a=win[0],b=win[win.length-1];
  const est=Math.min(5000,Math.max(1000,sum/n-(b.t-a.t)*7700/span));
  const conf=Math.min(1,n/14);
  const p=S.meta.profile||DEF;
  const formula=calc(Object.assign({},p,{weight:b.t})).formula;
  return{ready:true,n,span,avg:r0(sum/n),change:b.t-a.t,est:r0(est),blend:r0(conf*est+(1-conf)*formula),trendW:b.t};
}

/* ---------- render ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=document.getElementById('main');
const pct=(a,b)=>b>0?Math.min(100,a/b*100):0;
const pcf=i=>`<span class="pcf"><b class="p">P</b> ${r0(i.p)} · <b class="c">C</b> ${r0(i.c)} · <b class="f">F</b> ${r0(i.f)}</span>`;

function renderToday(){
  const d=view.date,T=targets(),t=totals(d),list=items(d);
  const left=T.kcal-r0(t.k),over=left<0;
  const mac=(lab,v,g,c)=>`<div class="macro" style="--c:var(--${c})"><div class="lab"><span class="dot"></span>${lab}</div>
    <div class="val num">${r0(v)}<span> / ${g} g</span></div><div class="bar"><i style="width:${pct(v,g)}%"></i></div></div>`;
  main.innerHTML=`
  <div class="top">
    <h1>${nice(d)}</h1>
    <div class="datenav">
      <button class="icon" type="button" data-act="prev" aria-label="Previous day">‹</button>
      <button class="icon" type="button" data-act="next" aria-label="Next day" ${d>=today()?'disabled':''}>›</button>
    </div>
  </div>
  <section class="readout ${over?'over':''}">
    <div class="ring"><svg viewBox="0 0 204 204" aria-hidden="true"><circle class="track" cx="102" cy="102" r="90"/>

function chart(tr){
  const pts=tr.slice(-60);if(pts.length<2)return'';
  const W=340,H=160,L=38,R=10,Tp=10,B=22;
  let lo=Math.min(...pts.map(p=>Math.min(p.w,p.t))),hi=Math.max(...pts.map(p=>Math.max(p.w,p.t)));
  lo=Math.floor(lo*2)/2-0.5;hi=Math.ceil(hi*2)/2+0.5;
  const span=Math.max(1,diffDays(pts[0].d,pts[pts.length-1].d));
  const x=d=>L+(W-L-R)*diffDays(pts[0].d,d)/span, y=v=>Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
    <text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${r1(v)}</text>`).join('');
  const line=pts.map(p=>x(p.d).toFixed(1)+','+y(p.t).toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  const fmt=s=>parse(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scale weight and trend weight over time">
    ${grid}
    ${pts.map(p=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="2.5" fill="var(--muted)" opacity=".55"/>`).join('')}
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last.d)}" cy="${y(last.t)}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    <text x="${L}" y="${H-5}" font-size="11" fill="var(--muted)">${fmt(pts[0].d)}</text>
    <text x="${W-R}" y="${H-5}" font-size="11" fill="var(--muted)" text-anchor="end">${fmt(last.d)}</text></svg>
    <div class="small muted">Dots are scale readings. The line is your trend weight, which smooths out daily water swings.</div>`;
}

async function toJpeg(file){
  const bmp=await createImageBitmap(file);
  const sc=Math.min(1,896/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);

const isClaudeKey=()=>apiKey.startsWith('sk-ant');
async function call(url,opt){
  try{return await fetch(url,opt)}catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
}
function parseArr(text){
  const a=text.indexOf('['),b=text.lastIndexOf(']');
  if(a<0||b<a)throw{code:'invalid_json'};
  try{return JSON.parse(text.slice(a,b+1))}catch(e){throw{code:'invalid_json'}}
}
async function claude(data,signal,prompt=PROMPT){
  const res=await call('https://api.anthropic.com/v1/messages',{method:'POST',signal,
    headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:1500,messages:[{role:'user',content:[
      ...(data?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data}}]:[]),{type:'text',text:prompt}]}]})});
  if(res.status===401||res.status===403)throw{code:'bad_key'};
  if(res.status===429)throw{code:'rate_limited'};
  if(!res.ok)throw{code:'upstream_error'};
  const j=await res.json();
  return parseArr((j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''));
}
const G='https://generativelanguage.googleapis.com/v1beta/';
let gModels=null,gFor='';
/* Model names change over time, so ask the API which Flash models this key can use: newest full Flash first, Lite ones as fallbacks. */
const GM_LS='macroledger.gmodels';
const saveModels=()=>{try{localStorage.setItem(GM_LS,JSON.stringify({at:Date.now(),list:gModels}))}catch(e){}};
async function geminiModels(signal){
  if(gModels&&gFor===apiKey)return gModels;
  try{const c=JSON.parse(localStorage.getItem(GM_LS)||'null');
    if(c&&Array.isArray(c.list)&&c.list.length&&Date.now()-c.at<7*864e5){gModels=c.list;gFor=apiKey;return gModels}}catch(e){}
  const res=await call(G+'models?pageSize=200',{signal,headers:{'x-goog-api-key':apiKey}});
  if(res.status===400||res.status===401||res.status===403)throw{code:'bad_key'};
  if(!res.ok)throw{code:res.status===429?'rate_limited':'upstream_error'};
  const j=await res.json();
  const rank=n=>{
    if(n==='gemini-flash-latest')return 1e6;
    if(n==='gemini-flash-lite-latest')return 999;
    const m=/^gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/.exec(n);
    return m?+m[1]*(m[2]?1:1000):null;
  };
  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
    .map(m=>String(m.name||'').replace(/^models\//,'')).filter(n=>rank(n)!==null).sort((x,y)=>rank(y)-rank(x));
  // Lite models answer in a few seconds; full Flash is often overloaded on the free tier, so it is only the fallback.
  const full=names.filter(n=>rank(n)>=1000),lite=names.filter(n=>rank(n)<1000);
  const order=[lite[0],lite[1],full[0],full[1]].filter(Boolean);
  gModels=order.length?order:['gemini-flash-lite-latest','gemini-flash-latest'];gFor=apiKey;
  saveModels();
  return gModels;
}
async function gemini(data,signal,prompt=PROMPT){
  const models=await geminiModels(signal);
  let last='upstream_error';
  for(const m of models){
    // Give each model 12 seconds, then move on to the next one.
    const t=new AbortController(),stop=()=>t.abort();
    if(signal){if(signal.aborted)throw{code:'cancelled'};signal.addEventListener('abort',stop)}
    const timer=setTimeout(stop,12000);
    let res;
    try{res=await call(G+'models/'+m+':generateContent',{method:'POST',signal:t.signal,
      headers:{'content-type':'application/json','x-goog-api-key':apiKey},
      body:JSON.stringify({contents:[{parts:[...(data?[{inline_data:{mime_type:'image/jpeg',data}}]:[]),{text:prompt}]}],
        generationConfig:{responseMimeType:'application/json'}})})}
    catch(e){
      if(signal&&signal.aborted)throw{code:'cancelled'};
      last=e&&e.code==='cancelled'?'busy':'upstream_error';continue;
    }
    finally{clearTimeout(timer);if(signal)signal.removeEventListener('abort',stop)}
    if(res.status===401||res.status===403)throw{code:'bad_key'};
    if(!res.ok){last=res.status===429?'rate_limited':res.status===503?'busy':'upstream_error';continue}   // no free quota or gone: try the next model
    const j=await res.json();
    const c=j.candidates&&j.candidates[0];
    const text=((c&&c.content&&c.content.parts)||[]).map(x=>x.text||'').join('');

[{"name":"...","serving":"...","grams":150,"kcal":0,"protein":0,"carbs":0,"fat":0,"chain":null,"basis":"menu","note":"why, in under 12 words"}]
"basis" is "menu" when a menu table row was used, "database" when a database or reference row confirmed or changed the figure, "recalled" when you used a restaurant's published figure from memory, "estimate" when nothing usable matched. Keep "chain" as given. In notes, call the menu table "the saved menu", never "official".`;
    let raw;
    try{raw=await estimate(null,mine.signal,prompt)}
    catch(e){   // one more try after a short pause; the free models are often briefly overloaded
      if(ctl!==mine||(e&&e.code==='cancelled'))return items;
      await new Promise(r=>setTimeout(r,1500));
      if(ctl!==mine)return items;
      raw=await estimate(null,mine.signal,prompt);
    }
    const out=toItems(raw);
    if(!out.length)return unchecked();
    for(const i of out)if(!i.v)i.v='estimate';
    return out;
  }catch(e){return unchecked()}
}
function badge(i){
  if(!i.v)return'';
  const where=i.ck?CHAINS[i.ck].name:i.ch;
  const lab=i.v==='menu'?'Menu figure'+(where?' · '+where:''):i.v==='database'?'Checked with database'
    :i.v==='recalled'?'From memory'+(where?' · '+where:''):'Estimate only';
  return`<div class="sub" style="margin-top:4px"><span class="tag ${i.v==='menu'||i.v==='database'?'ok':''}">${esc(lab)}</span>${esc(i.vn||'')}</div>`;
}
function sheetStep(title,text){
  sheet.innerHTML=`${head(title)}
    <div class="card"><div class="muted">${esc(text)}</div></div>
    <button class="btn ghost full" type="button" data-act="close">Stop</button>`;
}
function sheetFdc(){
  sheet.innerHTML=`${head('Food database key')}
    <div class="small muted">Estimates are checked against the USDA food database. Without your own key the app shares a demo key that allows only a few lookups an hour, so some items may go unchecked. A key is free: sign up at <a href="https://fdc.nal.usda.gov/api-key-signup" target="_blank" rel="noopener">fdc.nal.usda.gov/api-key-signup</a> and it arrives by email. It is stored on this phone only.</div>
    <div class="field"><label for="d-in">USDA API key</label><input id="d-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key"></div>
    <button class="btn full" type="button" data-act="saveFdc">Save key</button>`;
}
async function analyze(fix){
  const file=sh.file;if(!file)return;
  if(!sampler&&!apiKey){sheetKey();scrim.classList.add('open');return}
  let prompt=PROMPT;
  if(sh.note)prompt+='\nThe person logging this meal added these details. Trust them over what the photo suggests: '+JSON.stringify(sh.note);
  if(fix&&sh.items)prompt+='\nYour earlier estimate for this photo was: '
    +JSON.stringify(sh.items.map(i=>({name:i.n,serving:i.u,kcal:i.k,protein:i.p,carbs:i.c,fat:i.f})))
    +'\nThe person says it needs correcting: '+JSON.stringify(fix)
    +'\nReply with the full corrected JSON array. Apply the correction, recalculate the numbers it affects, and leave items they did not mention unchanged.';
  const mine=ctl=new AbortController();
  sheetWait();scrim.classList.add('open');
  try{
    const out=await estimate(file,mine.signal,prompt);
    if(ctl!==mine)return;
    let items=toItems(out);
    if(!items.length){ctl=null;return sheetPhotoError('No food found in that photo. Try a clearer shot from above.')}
    items=await verify(items,mine,fix);
    if(ctl!==mine)return;ctl=null;
    sh.items=items;
    sheetReview();
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled'||ctl!==mine)return;
    ctl=null;
    if(HIDE.includes(code)){photoOK=false;render();return sheetPhotoError('Photo logging is not available here because Claude was not allowed to read images for this page.')}
    sheetPhotoError(ERR[code]||'Something went wrong reaching the photo service. Check your connection and try again.');
  }
}
photoInput.addEventListener('change',()=>{const f=photoInput.files&&photoInput.files[0];photoInput.value='';if(!f)return;
  sh={file:f,note:''};sheetContext();scrim.classList.add('open')});

function logItem(f,q,skipRecent){
  const k=ymOf(view.date),m=month(k),dd=ddOf(view.date);
  (m.days[dd]=m.days[dd]||[]).push({n:f.n,u:f.u,q,k:r1(f.k*q),p:r1(f.p*q),c:r1(f.c*q),f:r1(f.f*q)});
  touch(k);
  if(skipRecent)return;
  const key=f.n.toLowerCase()+'|'+f.u;
  S.meta.recent=[{n:f.n,u:f.u,k:f.k,p:f.p,c:f.c,f:f.f},...S.meta.recent.filter(x=>x.n.toLowerCase()+'|'+x.u!==key)].slice(0,12);
  touch('meta');
}
const num=id=>{const v=parseFloat(document.getElementById(id).value);return isFinite(v)?v:NaN};

scrim.addEventListener('click',e=>{
  if(e.target===scrim)return closeSheet();
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='close')closeSheet();
  else if(a==='back')sheetList();
  else if(a==='pick'){sh={food:window._hits[+b.dataset.i],q:1};sheetQty()}
  else if(a==='less'){sh.q=Math.max(0.25,sh.q-0.25);sheetQty()}
  else if(a==='more'){sh.q=Math.min(20,sh.q+0.25);sheetQty()}
  else if(a==='commit'){logItem(sh.food,sh.q);closeSheet();render()}
  else if(a==='custom')sheetCustom();
  else if(a==='mine')sheetMine();
  else if(a==='dropMine'){
    const f=S.meta.custom.splice(+b.dataset.i,1)[0];
    if(f){const key=f.n.toLowerCase()+'|'+f.u;S.meta.recent=S.meta.recent.filter(x=>x.n.toLowerCase()+'|'+x.u!==key);touch('meta')}
    sheetMine();
  }
  else if(a==='doRestore'){applyBackup(sh.backup);sh.backup=null;closeSheet();render()}
  else if(a==='photo')photoInput.click();
  else if(a==='saveKey'){const v=document.getElementById('k-in').value.trim();if(!v)return;apiKey=v;try{localStorage.setItem(KEY_LS,v)}catch(_){}
    render();if(sh.file)sheetContext();else closeSheet()}
  else if(a==='saveFdc'){const v=document.getElementById('d-in').value.trim();if(!v)return;fdcKey=v;try{localStorage.setItem(FDCKEY_LS,v)}catch(_){}closeSheet();render()}
  else if(a==='runPhoto'){sh.note=document.getElementById('p-note').value.trim().slice(0,300);analyze()}
  else if(a==='fixPhoto'){
    const v=document.getElementById('p-fix').value.trim().slice(0,300);
    if(!v){document.getElementById('p-fixerr').textContent='Write what should change first.';return}
    analyze(v);
  }
  else if(a==='dropItem'){sh.items.splice(+b.dataset.i,1);if(sh.items.length)sheetReview();else closeSheet()}
  else if(a==='commitPhoto'){for(const i of sh.items)logItem(i,1,true);closeSheet();render()}
  else if(a==='commitCustom'){
    const n=document.getElementById('c-n').value.trim(),u=document.getElementById('c-u').value.trim()||'1 serving';
    const f={n,u,p:num('c-p')||0,c:num('c-c')||0,f:num('c-f')||0,k:num('c-k')||0};
    const err=document.getElementById('c-err');
    if(!n){err.textContent='Give the food a name.';return}
    if(f.k<=0){err.textContent='Enter the macros or the calories.';return}
    if(document.getElementById('c-keep').checked){S.meta.custom=[f,...S.meta.custom.filter(x=>x.n.toLowerCase()!==n.toLowerCase())].slice(0,150)}
    logItem(f,1);closeSheet();render();
  }
});
scrim.addEventListener('input',e=>{

  else if(id==='c-k')sheet._kcalEdited=true;
  else if((id==='c-p'||id==='c-c'||id==='c-f')&&!sheet._kcalEdited){

/* ---------- main actions ---------- */
function go(date){view.date=date;ensureMonth(ymOf(date));render()}
main.addEventListener('change',e=>{
  if(e.target.id!=='w-date')return;
  const w=S.meta.weights[e.target.value];document.getElementById('w-in').value=w||'';
});
main.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='prev')go(addDays(view.date,-1));
  else if(a==='next'){if(view.date<today())go(addDays(view.date,1))}
  else if(a==='add')openSheet();
  else if(a==='photo'){if(standalone&&!apiKey){sheetKey();scrim.classList.add('open')}else photoInput.click()}
  else if(a==='setKey'){sheetKey();scrim.classList.add('open')}
  else if(a==='setFdc'){sheetFdc();scrim.classList.add('open')}
  else if(a==='dropFdc'){fdcKey='';try{localStorage.removeItem(FDCKEY_LS)}catch(_){}render()}
  else if(a==='export')exportData();
  else if(a==='restore')restoreInput.click();
  else if(a==='dropKey'){apiKey='';gModels=null;try{localStorage.removeItem(KEY_LS);localStorage.removeItem(GM_LS)}catch(_){}render()}
  else if(a==='del'){const k=ymOf(view.date);month(k).days[ddOf(view.date)].splice(+b.dataset.i,1);touch(k);render()}
  else if(a==='saveW'){
    const w=num('w-in'),d=document.getElementById('w-date').value,err=document.getElementById('w-err');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||d>today()){err.textContent='Pick today or an earlier day.';return}
    if(!(w>=25&&w<=300)){err.textContent='Enter a weight between 25 and 300 kg.';return}
    S.meta.weights[d]=r1(w);touch('meta');render();
  }
  else if(a==='delW'){delete S.meta.weights[b.dataset.d];touch('meta');render()}
  else if(a==='savePlan'){
    const p={sex:document.getElementById('p-sex').value,age:num('p-age'),height:num('p-h'),weight:num('p-w'),
      activity:+document.getElementById('p-act').value,pace:+document.getElementById('p-pace').value,ppk:+document.getElementById('p-ppk').value};
    if(!(p.age>=18&&p.age<=90&&p.height>=120&&p.height<=230&&p.weight>=35&&p.weight<=300))return;
    S.meta.profile=p;S.meta.targets=Object.assign({source:'formula'},calc(p));
    if(!S.meta.weights[today()])S.meta.weights[today()]=r1(p.weight);
    touch('meta');render();main.scrollTop=0;
  }
  else if(a==='adopt'){
    const A=adaptive();if(!A.ready)return;
    const p=Object.assign({},S.meta.profile||DEF,{weight:r1(A.trendW)});
    S.meta.profile=p;S.meta.targets=Object.assign({source:'adaptive'},calc(p,A.blend));
    touch('meta');render();main.scrollTop=0;
  }
});
document.querySelector('nav').addEventListener('click',e=>{

/* ---------- backup ---------- */
const restoreInput=document.getElementById('restore');
const say=t=>{const m=document.getElementById('b-msg');if(m)m.textContent=t};
async function exportData(){
  const name='macro-ledger-'+today()+'.json';
  const text=JSON.stringify({app:'macro-ledger',version:1,exported:new Date().toISOString(),meta:S.meta,logs:S.logs});
  try{
    const file=new File([text],name,{type:'application/json'});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'Macro Ledger backup'});say('Backup shared.');return}
      catch(e){if(e&&e.name==='AbortError')return}
    }
    const url=URL.createObjectURL(file),a=document.createElement('a');
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    say('Backup saved as '+name+'.');
  }catch(e){say('Could not save a backup in this browser.')}
}
/* Keep only well-formed data from a backup file. Returns null when the file is not a Macro Ledger backup. */
function readBackup(j){
  if(!j||typeof j!=='object'||!j.meta||typeof j.meta!=='object')return null;
  const n=v=>{v=Number(v);return isFinite(v)?v:0};
  const dayRe=/^\d{4}-\d{2}-\d{2}$/;
  const food=f=>f&&typeof f==='object'&&String(f.n||'').trim()
    ?{n:String(f.n).slice(0,60),u:String(f.u||'1 serving').slice(0,40),k:n(f.k),p:n(f.p),c:n(f.c),f:n(f.f)}:null;
  const meta=blankMeta(),m=j.meta;
  if(m.profile&&typeof m.profile==='object'){
    const p=m.profile;
    meta.profile={sex:p.sex==='f'?'f':'m',age:n(p.age)||DEF.age,height:n(p.height)||DEF.height,weight:n(p.weight)||DEF.weight,
      activity:n(p.activity)||DEF.activity,pace:n(p.pace),ppk:n(p.ppk)||DEF.ppk};
  }
  if(m.targets&&typeof m.targets==='object'&&n(m.targets.kcal)>0){
    const t=m.targets;
    meta.targets={source:t.source==='adaptive'?'adaptive':'formula',bmr:n(t.bmr),formula:n(t.formula),tdee:n(t.tdee),
      kcal:n(t.kcal),p:n(t.p),c:n(t.c),f:n(t.f),floored:!!t.floored};
  }
  for(const[d,w]of Object.entries(m.weights||{}))if(dayRe.test(d)&&n(w)>=25&&n(w)<=300)meta.weights[d]=r1(n(w));
  meta.custom=(Array.isArray(m.custom)?m.custom:[]).map(food).filter(Boolean).slice(0,150);
  meta.recent=(Array.isArray(m.recent)?m.recent:[]).map(food).filter(Boolean).slice(0,12);
  const logs={};let days=0;
  for(const[ym,mo]of Object.entries(j.logs&&typeof j.logs==='object'?j.logs:{})){
    if(!/^\d{4}-\d{2}$/.test(ym)||!mo||typeof mo.days!=='object'||!mo.days)continue;
    const out={};
    for(const[dd,list]of Object.entries(mo.days)){
      if(!/^\d{2}$/.test(dd)||!Array.isArray(list))continue;
      const its=list.map(i=>{const f=food(i);if(f)f.q=n(i.q)||1;return f}).filter(Boolean);
      if(its.length){out[dd]=its;days++}
    }
    logs[ym]={updated:0,days:out};
  }
  return{meta,logs,days,weighIns:Object.keys(meta.weights).length};
}
function applyBackup(b){
  const now=Date.now();
  // Months that exist here but not in the backup are emptied rather than dropped, so the change also reaches a synced account.
  for(const k of Object.keys(S.logs))if(!b.logs[k])b.logs[k]={updated:0,days:{}};
  b.meta.updated=now;for(const k in b.logs)b.logs[k].updated=now;
  S={meta:b.meta,logs:b.logs};
  month(ymOf(today()));
  dirty.add('meta');for(const k in S.logs){dirty.add(k);loaded.add(k)}
  cache();flush();
}
function sheetRestore(){
  const b=sh.backup;
  sheet.innerHTML=`${head('Restore this backup?')}
    <div class="card"><div class="kv"><span class="muted small">Days with food logged</span><span class="v num">${b.days}</span></div>
      <div class="kv"><span class="muted small">Weigh-ins</span><span class="v num">${b.weighIns}</span></div>
      <div class="kv"><span class="muted small">Saved foods</span><span class="v num">${b.meta.custom.length}</span></div></div>
    <div class="note" role="alert">This replaces everything currently stored in this browser. It cannot be undone.</div>
    <button class="btn full" type="button" data-act="doRestore">Replace my data</button>
    <button class="btn ghost full" type="button" data-act="close">Cancel</button>`;
}
restoreInput.addEventListener('change',async()=>{
  const f=restoreInput.files&&restoreInput.files[0];restoreInput.value='';if(!f)return;
  let b=null;try{b=readBackup(JSON.parse(await f.text()))}catch(e){}
  if(!b){say('That file is not a Macro Ledger backup.');return}
  sh={backup:b};sheetRestore();scrim.classList.add('open');
});
